# .github/ISSUE_TEMPLATE/feature_request.yml
name: "Feature request"
about: "Request a new feature or improvement for Armada."
title: "[Feature Request] Describe your feature"
labels: ["Feature"]
assignees: []
body:
  - |
    ### **Hardware Device**
    _Please enter the device you are using [e.g. AYN Thor]._

  - |
    ### **OS Version**
    _Please follow these steps to find and paste the Armada OS Version:_
    1. Open Steam's quick access menu
    2. Navigate to Decky (plug icon)
    3. Select **Armada Control**
    4. Navigate to Armada Control's settings (cog icon)
    5. Copy the text below **OS Version** and paste it here

  - |
    ### **Description**
    _A clear and concise description of the feature you are requesting._

  - |
    ### **Desired behavior**
    _Describe the behavior you want to see. Include examples, UI mockups, or workflows if helpful._

  - |
    ### **Additional comments**
    _Any other context, rationale, or constraints that will help evaluate or implement this feature._

  - |
    ### **Confirmations**
    - [ ] **I have read the project's README and documentation.**
    - [ ] **I searched existing issues and feature requests and confirm this is not a duplicate.**
    - [ ] **I included a clear use case and expected user benefit.**
    - [ ] **I attached mockups, examples, or links if they help explain the request.**
