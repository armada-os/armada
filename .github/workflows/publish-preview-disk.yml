---
name: Publish Preview disk image

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Build container image]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  resolve:
    name: Resolve Preview container
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event))
    runs-on: ubuntu-24.04-arm
    outputs:
      image_digest: ${{ steps.source.outputs.image_digest }}
      source_ref: ${{ steps.source.outputs.source_ref }}
    steps:
      - name: Resolve Preview source
        id: source
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}:testing"
          inspection=$(skopeo inspect --override-arch arm64 "docker://${image}")
          digest=$(jq -er '.Digest' <<< "${inspection}")
          revision=$(jq -er '.Labels["org.opencontainers.image.revision"]' <<< "${inspection}")
          if ! [[ "${digest}" =~ ^sha256:[a-f0-9]{64}$ && "${revision}" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::Preview container has an invalid digest or source revision."
            exit 1
          fi
          echo "image_digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "source_ref=${revision}" >> "${GITHUB_OUTPUT}"

  publish:
    name: Build and publish Preview image
    needs: resolve
    uses: ./.github/workflows/build-disk.yml
    with:
      tag: testing
      publish_r2: true
      image_digest: ${{ needs.resolve.outputs.image_digest }}
      source_ref: ${{ needs.resolve.outputs.source_ref }}
    secrets:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
