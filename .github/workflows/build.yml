---
name: Build container image
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build. Leave empty to use the workflow ref."
        type: string
        default: ""

env:
  ARMADA_CANONICAL_IMAGE: "ghcr.io/armada-os/armada"
  ARMADA_LEGACY_IMAGE: "ghcr.io/virtudude/armada"
  IMAGE_DESC: "Armada: a gaming-focused, SteamOS-like Fedora bootc image for ARM64 handhelds"
  IMAGE_NAME: "${{ github.event.repository.name }}"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  # Every merge to main publishes the "testing" channel; beta/stable are made by
  # promoting (retagging) a testing build via promote.yml — no rebuild.
  DEFAULT_TAG: "testing"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.branch }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - name: Prepare environment
        run: |
          registry="${IMAGE_REGISTRY,,}"
          name="${IMAGE_NAME,,}"
          echo "IMAGE_REGISTRY=${registry}" >> "${GITHUB_ENV}"
          echo "IMAGE_NAME=${name}" >> "${GITHUB_ENV}"
          echo "BUILD_CACHE_REF=${registry}/${name}-build-cache" >> "${GITHUB_ENV}"

      - name: Resolve manual build ref
        id: manual
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          branch="${INPUT_BRANCH}"
          if [ -z "${branch}" ]; then
            exit 0
          fi
          branch="${branch#refs/heads/}"
          if ! [[ "${branch}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Branch '${branch}' cannot be used as a matching container tag. Use letters, numbers, dots, underscores, or dashes."
            exit 1
          fi

          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"

      - name: Ensure container tools
        run: |
          set -euxo pipefail
          # ubuntu-24.04 dropped these from the runner image; the build,
          # rechunk, and publish steps need them.
          need=""
          for t in buildah jq podman skopeo systemd-container; do
            command -v "$t" >/dev/null || need="$need $t"
          done
          [ -z "$need" ] || { sudo apt-get update && sudo apt-get install -y $need; }

      - name: Require signing key before publishing a channel
        if: github.event_name != 'pull_request'
        run: |
          if [ -z "${{ secrets.SIGNING_SECRET }}" ]; then
            echo "::error::SIGNING_SECRET is not set — refusing to publish an unsigned image (devices verify ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }})."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.manual.outputs.branch || github.ref }}
          persist-credentials: false

      - name: Check build recipes
        uses: ublue-os/just-action@30ab4659369934b65b655bf8d2fa4ddd6547d384 # v3

      - name: Get image version
        id: version
        run: |
          echo "created=$(date -u +%Y\-%m\-%d\T%H\:%M\:%S\Z)" >> $GITHUB_OUTPUT
          echo "version=$(TZ=America/New_York date +%Y%m%d).$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "cache_epoch=$(date -u +%G-W%V)" >> $GITHUB_OUTPUT

      - name: Resolve external component versions
        id: external
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          external_inputs="${RUNNER_TEMP}/external-inputs.env"
          .github/scripts/resolve-external-inputs.sh > "${external_inputs}"
          cat "${external_inputs}" >> "${GITHUB_OUTPUT}"

      - name: Image Metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          tags: |
            type=raw,value=${{ steps.manual.outputs.branch || env.DEFAULT_TAG }}
            type=sha,enable=${{ github.event_name == 'pull_request' }}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.created=${{ steps.version.outputs.created }}
            org.opencontainers.image.description=${{ env.IMAGE_DESC }}
            org.opencontainers.image.documentation=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/${{ github.sha }}/README.md
            org.opencontainers.image.licenses=GPL-2.0-or-later
            org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/blob/${{ github.sha }}/Containerfile
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.url=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/tree/${{ github.sha }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            containers.bootc=1
          sep-tags: " "
          sep-annotations: " "

      - name: Log in to GHCR
        env:
          PUBLISH_IMAGE: ${{ github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          if ! echo "${{ secrets.GITHUB_TOKEN }}" | sudo skopeo login ghcr.io \
            -u "${{ github.actor }}" --password-stdin; then
            if [[ "${PUBLISH_IMAGE}" == "true" ]]; then
              echo "::error::GHCR login failed; cannot publish the image"
              exit 1
            fi
            echo "::warning::GHCR login failed; continuing the PR build without remote cache"
          fi

      - name: Build Image
        id: build_image
        env:
          IMAGE_LABELS: ${{ steps.metadata.outputs.labels }}
          PUBLISH_CACHE: ${{ github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          build_args=(
            --build-arg "ARMADA_VERSION=${{ steps.version.outputs.version }}"
            --build-arg "CACHE_EPOCH=${{ steps.version.outputs.cache_epoch }}"
            --build-arg "STEAM_ARM_RUNTIME_SNAPSHOT=${{ steps.external.outputs.STEAM_ARM_RUNTIME_SNAPSHOT }}"
            --build-arg "STEAM_ARM_MANIFEST_SHA256=${{ steps.external.outputs.STEAM_ARM_MANIFEST_SHA256 }}"
            --build-arg "ARCH_ROOTFS_URL=${{ steps.external.outputs.ARCH_ROOTFS_URL }}"
            --build-arg "ARCH_ROOTFS_XXH64=${{ steps.external.outputs.ARCH_ROOTFS_XXH64 }}"
            --build-arg "PROTON_VERSION=${{ steps.external.outputs.PROTON_VERSION }}"
            --build-arg "PROTON_SHA256=${{ steps.external.outputs.PROTON_SHA256 }}"
            --build-arg "DECKY_VERSION=${{ steps.external.outputs.DECKY_VERSION }}"
            --build-arg "DECKY_SHA256=${{ steps.external.outputs.DECKY_SHA256 }}"
            --build-arg "DECKY_SERVICE_SHA256=${{ steps.external.outputs.DECKY_SERVICE_SHA256 }}"
          )
          label_args=()
          while IFS= read -r label; do
            [[ -z "${label}" ]] || label_args+=(--label "${label}")
          done <<< "${IMAGE_LABELS}"
          cache_args=()
          have_cache_from=false
          if sudo skopeo list-tags "docker://${BUILD_CACHE_REF}" >/dev/null 2>&1; then
            cache_args+=(--cache-from "${BUILD_CACHE_REF}")
            have_cache_from=true
          fi
          if [[ "${PUBLISH_CACHE}" == "true" ]]; then
            cache_args+=(--cache-to "${BUILD_CACHE_REF}")
            if [[ "${have_cache_from}" != "true" ]]; then
              echo "No existing build cache found; this run will populate ${BUILD_CACHE_REF}"
            fi
          fi

          start=${SECONDS}
          sudo buildah build \
            --layers \
            --pull=always \
            --format=docker \
            --tag localhost/raw-img \
            "${cache_args[@]}" \
            "${build_args[@]}" \
            "${label_args[@]}" \
            .
          echo "Build completed in $((SECONDS - start)) seconds"

      - name: Rechunk for small OTA deltas
        id: rechunk
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          IMAGE_FULL="${IMAGE_REGISTRY}/${IMAGE_NAME}"
          CHANNEL_TAG="${{ steps.manual.outputs.branch || env.DEFAULT_TAG }}"
          previous_ref="docker://${IMAGE_FULL}:${CHANNEL_TAG}"
          if previous_manifest="$(sudo skopeo inspect --raw "${previous_ref}" 2>/dev/null)" &&
             jq -e '(.layers | length) > 1 and all(.layers[1:][]; (.annotations["ostree.components"] // "") != "")' \
                <<<"${previous_manifest}" >/dev/null; then
            echo "Reusing annotated previous chunked build at ${previous_ref}"
          else
            echo "No annotated previous chunked build found at ${previous_ref}; rpm-ostree will treat this as a first build"
          fi

          chunked_oci="${RUNNER_TEMP}/chunked-oci"
          mkdir -p "${chunked_oci}"
          start=${SECONDS}
          sudo podman run --rm --privileged \
            --volume /var/lib/containers:/var/lib/containers \
            --volume "${chunked_oci}:/output" \
            localhost/raw-img \
            rpm-ostree compose build-chunked-oci --bootc --max-layers 127 \
            --format-version 2 \
            --previous-build "${previous_ref}" \
            --from localhost/raw-img --output oci:/output:chunked-img
          sudo skopeo inspect --raw "oci:${chunked_oci}:chunked-img" |
            jq -e '(.layers | length) > 1 and all(.layers[1:][]; (.annotations["ostree.components"] // "") != "")' \
              >/dev/null || {
                echo "::error::Rechunked OCI image is missing ostree.components layer annotations"
                exit 1
              }
          echo "Rechunk completed in $((SECONDS - start)) seconds"

      - name: Push to GHCR
        id: push
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          IMAGE_FULL="${IMAGE_REGISTRY}/${IMAGE_NAME}"
          BUILD_TAG="build-${{ steps.version.outputs.version }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          n=0
          until sudo skopeo copy \
                --format oci \
                "oci:${RUNNER_TEMP}/chunked-oci:chunked-img" "docker://${IMAGE_FULL}:${BUILD_TAG}"; do
            n=$((n + 1)); [ "${n}" -ge 3 ] && exit 1; sleep 15
          done
          # skopeo --digestfile can't write under sudo's userns remap; read it back.
          digest=$(sudo skopeo inspect --format '{{.Digest}}' "docker://${IMAGE_FULL}:${BUILD_TAG}")
          sudo skopeo inspect --raw "docker://${IMAGE_FULL}@${digest}" |
            jq -e '(.layers | length) > 1 and all(.layers[1:][]; (.annotations["ostree.components"] // "") != "")' \
              >/dev/null || {
                echo "::error::Published image lost rpm-ostree chunk annotations"
                exit 1
              }
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && env.HAVE_SIGNING_SECRET == 'true'
        env:
          HAVE_SIGNING_SECRET: ${{ secrets.SIGNING_SECRET != '' }}
        with:
          cosign-release: 'v2.6.3'

      - name: Sign container image
        if: github.event_name != 'pull_request' && env.HAVE_SIGNING_SECRET == 'true'
        run: |
          set -euo pipefail
          IMAGE_FULL="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}"
          IMAGE_REF="${IMAGE_FULL}@${{ steps.push.outputs.digest }}"
          # cosign runs rootless and has its own auth store — the build-cache
          # login only authenticated root, so log cosign in too.
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          # Sign the digest, not a tag (a concurrent run could re-point the tag).
          # --new-bundle-format=false: bootc's verifier expects the legacy .sig; the
          # default flips in cosign v3.
          cosign sign -y --new-bundle-format=false --key env://COSIGN_PRIVATE_KEY "${IMAGE_REF}"

          # Legacy-hosted images also need the canonical identity required by bridge policy.
          if [ "${IMAGE_FULL}" = "${ARMADA_LEGACY_IMAGE}" ]; then
            cosign sign -y --new-bundle-format=false \
              --key env://COSIGN_PRIVATE_KEY \
              --sign-container-identity "${ARMADA_CANONICAL_IMAGE}" \
              "${IMAGE_REF}"
          fi

          if [ "${{ github.event.repository.fork }}" != "true" ]; then
            cosign verify --key system_files/etc/pki/containers/armada.pub "${IMAGE_REF}"
            if [ "${IMAGE_FULL}" = "${ARMADA_LEGACY_IMAGE}" ]; then
              cosign verify --check-claims=false \
                --key system_files/etc/pki/containers/armada.pub \
                "${IMAGE_REF}" |
                jq -s -e --arg identity "${ARMADA_CANONICAL_IMAGE}" \
                  'any(.. | objects; .critical?.identity?["docker-reference"]? == $identity)'
            fi
          fi
        env:
          HAVE_SIGNING_SECRET: ${{ secrets.SIGNING_SECRET != '' }}
          TAGS: ${{ steps.push.outputs.digest }}
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}

      - name: Publish channel tags
        if: github.event_name != 'pull_request' && env.HAVE_SIGNING_SECRET == 'true'
        run: |
          set -euo pipefail
          IMAGE_FULL="${IMAGE_REGISTRY}/${IMAGE_NAME}"
          SRC="docker://${IMAGE_FULL}@${{ steps.push.outputs.digest }}"
          for tag in ${{ steps.metadata.outputs.tags }}; do
            n=0
            until sudo skopeo copy --all --format oci "${SRC}" "docker://${IMAGE_FULL}:${tag}"; do
              n=$((n + 1)); [ "${n}" -ge 3 ] && exit 1; sleep 15
            done
          done
        env:
          HAVE_SIGNING_SECRET: ${{ secrets.SIGNING_SECRET != '' }}
