---
name: Promote release

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Channel to promote to"
        type: choice
        options: [beta, stable]
        required: true
      source:
        description: "Source tag to promote from (e.g. staging or testing)"
        type: string
        default: testing
      version:
        description: "Optional release version (e.g. 1.0). Set when cutting a release: keeps an immutable :<version> tag as the permanent pin for the downloadable disk image."
        type: string
        default: ""

env:
  ARMADA_CANONICAL_IMAGE: "ghcr.io/armada-os/armada"
  ARMADA_LEGACY_IMAGE: "ghcr.io/virtudude/armada"
  IMAGE_NAME: ${{ github.event.repository.name }}
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"

concurrency:
  group: ${{ github.workflow }}-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  promote:
    name: Promote ${{ inputs.source }} -> ${{ inputs.target }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare environment
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "${GITHUB_ENV}"
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "${GITHUB_ENV}"
          need=""
          for tool in jq skopeo; do
            command -v "$tool" >/dev/null || need="$need $tool"
          done
          [ -z "$need" ] || { sudo apt-get update && sudo apt-get install -y $need; }

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.6.3'

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Verify source container signature
        id: resolve
        run: |
          set -euxo pipefail
          REPO="${IMAGE_REGISTRY}/${IMAGE_NAME}"
          # Pin to the digest so verify and the retag below act on the same image
          # even if a concurrent build re-points the source tag in between.
          DIGEST=$(skopeo inspect --format '{{.Digest}}' "docker://${REPO}:${{ inputs.source }}")
          # Fail closed: never promote an unsigned build into beta/stable.
          cosign verify --key system_files/etc/pki/containers/armada.pub "${REPO}@${DIGEST}"
          if [ "${REPO}" = "${ARMADA_LEGACY_IMAGE}" ]; then
            # Legacy promotions must carry the canonical identity required by bridge policy.
            cosign verify --check-claims=false \
              --key system_files/etc/pki/containers/armada.pub \
              "${REPO}@${DIGEST}" |
              jq -s -e --arg identity "${ARMADA_CANONICAL_IMAGE}" \
                'any(.. | objects; .critical?.identity?["docker-reference"]? == $identity)'
          fi
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"

      - name: Publish release tags
        run: |
          set -euxo pipefail
          REPO="${IMAGE_REGISTRY}/${IMAGE_NAME}"
          SRC="${REPO}@${{ steps.resolve.outputs.digest }}"
          promote() { skopeo copy --all "docker://${SRC}" "docker://${REPO}:$1"; }

          promote "${{ inputs.target }}"

          # stable doubles as :latest for tooling that expects it.
          if [ "${{ inputs.target }}" = stable ]; then
            promote latest
          fi

          # Tag the release.
          if [ -n "${{ inputs.version }}" ]; then
            promote "${{ inputs.version }}"
          fi
