# Drop-in for vela-npu@.service: when vela-npu-setup.service has linked /run/vela-npu/graphs (Snapdragon 8 Elite, SM8750),
# the v79 build of this instance's graph is mounted read-only over /usr/lib64/vela-npu/%i.bin in the daemon's own mount
# namespace, so the unit's --ctx path loads it. Without the link ("-": a missing source is ignored) nothing changes.
[Service]
BindReadOnlyPaths=-/run/vela-npu/graphs/%i.bin:/usr/lib64/vela-npu/%i.bin
