# Drop-in for vela-npu-setup.service: on the Snapdragon 8 Elite (SM8750, Hexagon v79) it links /run/vela-npu/graphs to the
# v79 build of the 7 graphs (/usr/lib64/vela-npu/v79); vela-npu@.service.d/50-vela-npu-chip.conf then uses it. On any
# other chip nothing is created and the daemons use the HTP v73 graphs in /usr/lib64/vela-npu, as before.
[Service]
ExecStart=/usr/bin/sh -c 'grep -qzx qcom,sm8750 /proc/device-tree/compatible || exit 0; mkdir -p /run/vela-npu && ln -sfn /usr/lib64/vela-npu/v79 /run/vela-npu/graphs && echo "SM8750: using the Hexagon v79 graphs in /usr/lib64/vela-npu/v79"'
