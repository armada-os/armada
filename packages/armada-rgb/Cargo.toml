[package]
name = "armada-rgb"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "RGB lighting controller for Armada"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
lto = "thin"
panic = "abort"
strip = true
