# SM8750 handhelds. Board compatibles from packages/kernel/dts, identity from
# system_files/usr/lib/armada/devices/*.conf.

[[device]]
dt.compatible = "ayn,odin3"
device        = "ayn_odin_3"
variant       = "Odin3"
friendly_name = "AYN Odin 3"

[[device]]
dt.compatible = "ayn,odin3portal"
device        = "ayn_odin_3_portal"
variant       = "Odin3Portal"
friendly_name = "AYN Odin 3 Portal"

[[device]]
dt.compatible = "konkr,pocket-fit-elite"
device        = "konkr_pocket_fit_elite"
variant       = "PocketFITElite"
friendly_name = "KONKR Pocket FIT Elite"

# armada-powerd owns the governor and serves CpuScaling1 over remotes.d.
[cpu_scaling]
driver = "none"

# qcom_battmgr raises end thresholds below 55 to 55.
[battery_charge_limit]
suggested_minimum_limit = 55
method = "power_supply"
