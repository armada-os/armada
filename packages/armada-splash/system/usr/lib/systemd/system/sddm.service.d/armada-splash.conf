# The DRM drawer holds the master (else kernel fbdev steals scanout); the
# takeover write is its deactivate handshake and must precede the stop so it
# yields (and lingers) instead of dying to TERM with the display.
[Service]
ExecStartPre=-/bin/sh -c "echo sddm > /run/armada/takeover"
ExecStartPre=-/usr/bin/systemctl stop --no-block armada-splash-early.service
