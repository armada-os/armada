# Power off instead of suspending when the battery runs out. UPower's Auto
# action resolves to a suspend on these devices (no hibernation), and a
# handheld keeps draining in s2idle until it browns out at 0%.
[UPower]
PercentageLow=15.0
PercentageCritical=6.0
PercentageAction=3.0
CriticalPowerAction=PowerOff
