set!armada_zram_size = /usr/bin/grep -Fzxq -- retroidpocket,duo "${ZRAM_GENERATOR_ROOT:-}/sys/firmware/devicetree/base/compatible" 2>/dev/null && echo 8192 || echo 'min(ram, 16384)'

[zram0]
zram-size = armada_zram_size
zram-resident-limit = min(ram / 2, 8192)
compression-algorithm = zstd
swap-priority = 100
fs-type = swap
