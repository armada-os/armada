ARMADA_DEVICE_ID=mangmi-air-y-pro
ARMADA_DEVICE_NAME='MANGMI Air Y Pro'
ARMADA_SOC_CLASS=SM8250

# Preserve the panel's 4:3 aspect ratio at Armada's standard SteamUI density.
ARMADA_GAMESCOPE_FAKE_OUTPUT_MM=120x90

# The board's MCU profile exposes a DualSense target plus a keyboard target for
# the dedicated back/F1 button; do not offer target types it cannot instantiate.
ARMADA_IP_TARGETS=ds5
