ARMADA_DEVICE_ID=ayaneo-pocket-s2k
ARMADA_DEVICE_NAME='AYANEO Pocket S 2K'
ARMADA_SOC_CLASS=SM8550

ARMADA_PRIMARY_CONNECTOR=DSI-1
ARMADA_PANEL_ORIENTATION=right
ARMADA_PANEL_NATIVE_WIDTH=1440
ARMADA_PANEL_NATIVE_HEIGHT=2560
ARMADA_PANEL_REFRESH_RATES=60
ARMADA_GAMEPAD_QUIRK=ayaneo-xbox
# This device physically has AYA SPACE, a "two bars" button, LC and RC, but
# nothing reaches userspace: its device tree declares no aya-keys node, and the
# MCU reports only 11 buttons (A B X Y L1 R1 Select Start Mode L3 R3), so it
# emits neither the BTN5 that ayaneo_mcu_xbox maps to QuickAccess nor the
# BTN3/4/6/7 it maps to paddles. On deck-uhid that leaves no way into the QAM
# at all, because Steam assumes a hardware QAM button and drops its Guide+A
# fallback. xb360 restores Guide+A, and there is nothing live to lose.
#
# Revisit when this device gets an aya-keys node like the Pocket EVO: it will
# then have a real QuickAccess button and paddles, and paddles only exist on
# deck-uhid, so this should move back.
ARMADA_CONTROLLER_TYPE=xb360
