ARMADA_DEVICE_ID=ayn-odin-3-portal
ARMADA_DEVICE_NAME='AYN Odin 3 Portal'
ARMADA_SOC_CLASS=SM8750

ARMADA_PANEL_ORIENTATION=left
ARMADA_HDR_NITS=750
ARMADA_BACKLIGHT_GAMMA=2.4
ARMADA_BACKLIGHT_INPUT_MIN=0.01
ARMADA_BACKLIGHT_MIN=0.01
ARMADA_BACKLIGHT_MAX=0.84

# direct: raw rsinput gamepad without InputPlumber (controller-type set direct).
ARMADA_IP_TARGETS=deck-uhid,xbox-series,xb360,ds5,direct
# Direct-mode gyro: rotates the libssc IMU axes into SDL's (X right, Y top, Z toward
# the player), row-major. Measured with the device flat, upright and on its left edge.
ARMADA_DIRECT_IMU_MATRIX=0,-1,0,1,0,0,0,0,1
