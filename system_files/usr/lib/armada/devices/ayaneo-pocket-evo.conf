ARMADA_DEVICE_ID=ayaneo-pocket-evo
ARMADA_DEVICE_NAME='AYANEO Pocket EVO'
ARMADA_SOC_CLASS=SM8550

ARMADA_PRIMARY_CONNECTOR=DSI-1
ARMADA_PANEL_ORIENTATION=left
ARMADA_PANEL_NATIVE_WIDTH=1080
ARMADA_PANEL_NATIVE_HEIGHT=1920
ARMADA_PANEL_REFRESH_RATES=60,120
ARMADA_GAMEPAD_QUIRK=ayaneo-xbox
# AYA SPACE is a real QuickAccess button (aya-keys), and =, LC and RC are
# exposed as paddles - both need deck-uhid. QuickAccess reaches Steam on xb360
# too, but the paddles do not, so deck-uhid is the better trade here. The cost
# is Guide+A, which Steam only offers to controllers without a QAM button.
ARMADA_CONTROLLER_TYPE=deck-uhid
