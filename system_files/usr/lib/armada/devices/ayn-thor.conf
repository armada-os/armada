ARMADA_DEVICE_ID=ayn-thor
ARMADA_DEVICE_NAME='AYN Thor'
ARMADA_SOC_CLASS=SM8550

# Dual screen: top panel is DSI-2 (mdss_dsi1), bottom panel is DSI-1
# (mdss_dsi0). Gamescope drives only the top panel; the desktop session
# uses both (see desktop-bootstrap).
ARMADA_PRIMARY_CONNECTOR=DSI-2
ARMADA_PRIMARY_BACKLIGHT=ae96000.dsi.0
ARMADA_PRIMARY_TOUCHSCREEN=top_touchscreen
ARMADA_SECONDARY_CONNECTOR=DSI-1
ARMADA_SECONDARY_BACKLIGHT=ae94000.dsi.0
ARMADA_SECONDARY_TOUCHSCREEN=bottom_touchscreen
ARMADA_VIRTUAL_KEYBOARD_CONNECTOR=DSI-1
ARMADA_PANEL_ORIENTATION=right
ARMADA_HDR_NITS=650

# direct: raw rsinput gamepad without InputPlumber (controller-type set direct).
ARMADA_IP_TARGETS=deck-uhid,xbox-series,xb360,ds5,direct
# Direct-mode gyro: rotates the libssc IMU axes into SDL's (X right, Y top, Z toward
# the player), row-major. Measured with the device flat, upright and on its left edge. The Thor's
# IMU sits about 11.4 degrees tilted about X in the base.
ARMADA_DIRECT_IMU_MATRIX=0,-1,0,0.9804,0,-0.1969,0.1969,0,0.9804
