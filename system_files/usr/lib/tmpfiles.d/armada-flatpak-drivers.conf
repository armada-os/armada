# Armada's Mesa drivers for Flatpak apps (why: packages/mesa/build.sh).
# Flatpak mounts the GL.host folder named for the app runtime's branch; unlisted branches
# keep their own Mesa. No 1.4: every runtime accepts it and mounts it on top. Drop a
# branch with an "r" line; tmpfiles never removes old links.
r /var/lib/flatpak/extension/org.freedesktop.Platform.GL.host/aarch64/1.4
L+ /var/lib/flatpak/extension/org.freedesktop.Platform.GL.host/aarch64/25.08 - - - - /usr/share/armada/flatpak-mesa
L+ /var/lib/flatpak/extension/org.freedesktop.Platform.GL.host/aarch64/26.08 - - - - /usr/share/armada/flatpak-mesa
# Unreleased; armada-flatpak-drivers reports one that can't load ours.
L+ /var/lib/flatpak/extension/org.freedesktop.Platform.GL.host/aarch64/27.08 - - - - /usr/share/armada/flatpak-mesa
L+ /var/lib/flatpak/extension/org.freedesktop.Platform.GL.host/aarch64/28.08 - - - - /usr/share/armada/flatpak-mesa
L+ /var/lib/flatpak/extension/org.freedesktop.Platform.GL.host/aarch64/29.08 - - - - /usr/share/armada/flatpak-mesa
L+ /var/lib/flatpak/extension/org.freedesktop.Platform.GL.host/aarch64/30.08 - - - - /usr/share/armada/flatpak-mesa
# A link into /usr, so a rollback without these drivers leaves no override. "L" keeps an
# override someone already made.
d /var/lib/flatpak/overrides 0755 - - -
L /var/lib/flatpak/overrides/global - - - - /usr/share/armada/flatpak-override
