# Armada's Mesa drivers for Flatpak apps (why: packages/mesa/build.sh).
# Flatpak always counts "host" as an active GL driver, so it mounts GL.host into
# every app; 1.4 is the GL ABI branch every Freedesktop runtime accepts.
L+ /var/lib/flatpak/extension/org.freedesktop.Platform.GL.host/aarch64/1.4 - - - - /usr/share/armada/flatpak-mesa
# The global override is a link into /usr so a rollback to an image without these
# drivers leaves it dangling (no override) rather than pointing apps at a missing
# Vulkan driver. "L" keeps an override someone already made.
d /var/lib/flatpak/overrides 0755 - - -
L /var/lib/flatpak/overrides/global - - - - /usr/share/armada/flatpak-override
