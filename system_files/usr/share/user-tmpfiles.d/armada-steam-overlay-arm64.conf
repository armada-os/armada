# The arm64 Steam client ships steamrtarm64/steamoverlayvulkanlayer.so but only
# registers the i386 and x86_64 overlay layers, so Vulkan games (all of Proton
# via DXVK/VKD3D) get no in-game overlay outside gamescope (Desktop Mode).
# Register the arm64 layer the same way Steam registers its fossilize layer.
# "f" never overwrites: if Steam starts writing this file itself, its copy wins.
d %h/.local/share/vulkan 0755 - - -
d %h/.local/share/vulkan/implicit_layer.d 0755 - - -
f %h/.local/share/vulkan/implicit_layer.d/steamoverlay_arm64.json 0644 - - - {\n\t"file_format_version" : "1.0.0",\n\t"layer" : {\n\t\t"name": "VK_LAYER_VALVE_steam_overlay_arm64",\n\t\t"type": "GLOBAL",\n\t\t"library_path": "%h/.local/share/Steam/steamrtarm64/steamoverlayvulkanlayer.so",\n\t\t"api_version": "1.3.207",\n\t\t"implementation_version": "1",\n\t\t"description": "Steam Overlay Layer",\n\t\t"disable_environment": { "DISABLE_VK_LAYER_VALVE_steam_overlay_1": "1" },\n\t\t"enable_environment": { "ENABLE_VK_LAYER_VALVE_steam_overlay_1": "1" }\n\t}\n}\n
