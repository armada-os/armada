Syntax 4

SectionUseCase."HiFi" {
	File "/Qualcomm/sm8650/APS2/HiFi.conf"
	Comment "HiFi quality Music."
}

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
Include.wcd-init.File "/codecs/wcd939x/init.conf"
Include.wsam-init.File "/codecs/qcom-lpass/wsa-macro/init.conf"
Include.rxm-init.File "/codecs/qcom-lpass/rx-macro/init.conf"
Include.wsa-init.File "/codecs/wsa884x/two-speakers/init.conf"

If.pockets2 {
	Condition {
		Type String
		String1 "${sys:firmware/devicetree/base/model}"
		String2 "AYANEO Pocket S2"
	}
	True {
		# The SoundWire compander controls PA gain; adjust the input digitally.
		LibraryConfig.remap.Config {
			ctl.default.map {
				"name='Speakers Digital Playback Volume'" {
					"name='WSA_RX0 Digital Volume'".vindex.0 0
					"name='WSA_RX1 Digital Volume'".vindex.1 0
				}
			}
		}
	}
}
