# KONKR Pocket FIT headphones in HPH PCM mode, included after the shared
# wcd939x and rx-macro sequences (alsa-lib appends included sequences in
# order, so these override the LOHIFI settings those make).

EnableSequence [
	# Stock Android's amplifier mode on this board.
	cset "name='RX_HPH PWR Mode' ULP"
	cset "name='RX HPH Mode' CLS_H_ULP"
	# The compander drives the PA hard enough that full-scale peaks clip;
	# 8 dB of digital headroom keeps full volume usable.
	cset "name='RX_RX0 Digital Volume' 76"
	cset "name='RX_RX1 Digital Volume' 76"
]

DisableSequence [
	# After the shared sequences have turned the HPHL/HPHR switches off
	# (the HIFI_PCM ports, while PCM is still selected), leave PCM mode.
	cset "name='HPH PCM Switch' 0"
	cset "name='RX_HPH PCM Switch' 0"
	cset "name='RX_RX0 Digital Volume' 84"
	cset "name='RX_RX1 Digital Volume' 84"
]
