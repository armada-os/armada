# Use case configuration for AYN SM8750
# Author: Teguh Sobirin <teguh@sobir.in>

SectionVerb {
	EnableSequence [
		cset "name='SECONDARY_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia4' 1"
	]

	Include.wcde.File "/codecs/wcd939x/DefaultEnableSeq.conf"

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker playback"

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones playback"

	# rx-macro routing first, then the PCM mode flags, then the wcd939x
	# bring-up: the HPH and COMP switches connect their SoundWire ports
	# when set, so the mode has to be in place before they come up.
	Include.rxmhpe.File "/codecs/qcom-lpass/rx-macro/HeadphoneEnableSeq.conf"

	EnableSequence [
		cset "name='HPH PCM Switch' 1"
		cset "name='RX_HPH PCM Switch' 1"
	]

	Include.wcdhpe.File "/codecs/wcd939x/HeadphoneEnableSeq.conf"

	Include.wcdhpd.File "/codecs/wcd939x/HeadphoneDisableSeq.conf"
	Include.rxmhpd.File "/codecs/qcom-lpass/rx-macro/HeadphoneDisableSeq.conf"

	DisableSequence [
		cset "name='HPH PCM Switch' 0"
		cset "name='RX_HPH PCM Switch' 0"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},1"
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "HP Digital"
		JackControl "Headphone Jack"
		JackHWMute "Speaker"
	}
}

# HDMI/DisplayPort out over USB-C on its own PCM, so the three outputs are three
# sinks in one card profile and switching between them is just a default-sink
# change. Sharing the speaker PCM instead makes pipewire model them as
# alternative card profiles: switching then destroys and rebuilds sinks, driven
# by availability that lags the cable, and the card gets stranded on a profile it
# reports as unavailable with nothing playing.
#
# The verb attaches MultiMedia4 to the DisplayPort backend once and leaves it
# there, and kernel patch 0618 lets that PCM be prepared while the display is
# off. Both are needed: pipewire opens AND prepares the PCM of every device while
# it builds the card, an unattached backend fails that open ("no backend DAIs
# enabled") and the old prepare refused outright with the display off, and either
# failure costs the whole profile, speakers included. Playing to this sink with no
# display attached is harmless, the DSP just refuses to start the port.
#
# The JackHWMute lines are what give the output order, not PlaybackPriority.
# Wireplumber picks the default sink by node priority, and its alsa monitor
# derives that from the PCM device number alone (dev 0 = 1000, then 744 - 16*dev),
# so the speakers on hw:,0 outrank everything and PlaybackPriority never enters
# into it. What it does honour is availability, so each output marks the ones it
# should beat as unavailable: headphones mute Speaker and HDMI, HDMI mutes
# Speaker. That gives headphones > HDMI > speakers in every combination.
SectionDevice."HDMI" {
	Comment "HDMI / DisplayPort playback"

	Value {
		PlaybackChannels 2
		PlaybackPriority 150
		PlaybackPCM "hw:${CardId},3"
		PlaybackMixer "default:${CardId}"
		JackControl "DP0 Jack"
		JackHWMute "Speaker"
	}
}
