# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/composite_device_v1.json
version: 1
kind: CompositeDevice
name: MANGMI Air Y Pro

matches:
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: MANGMI Air Y Pro

single_source: false

source_devices:
  - group: gamepad
    evdev:
      name: MANGMI Air Y Pro Joypad
      phys_path: mangmi-air-y-pro/input0
      handler: event*
    capability_map_id: air_y_pro_mcu
  - group: gamepad
    evdev:
      name: pm8941_resin
      phys_path: pm8941_resin/input0
      handler: event*
    capability_map_id: air_y_pro_mcu
  - group: gamepad
    evdev:
      name: pwm-vibrator
      handler: event*

options:
  auto_manage: true

target_devices:
  - deck-uhid
  - keyboard
