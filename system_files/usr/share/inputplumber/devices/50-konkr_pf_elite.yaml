version: 1
kind: CompositeDevice
name: KONKR Pocket FIT Elite
matches:
- udev:
    sys_path: /sys/firmware/devicetree/base
    attributes:
    - name: model
      value: KONKR Pocket FIT Elite
single_source: false
source_devices:
- group: gamepad
  evdev:
    name: AYANEO MCU Gamepad
    handler: event*
  capability_map_id: konkr_gamepad
- group: gamepad
  evdev:
    name: KONKR System Buttons
    handler: event*
  capability_map_id: konkr_sysbtn
- group: imu
  iio:
    name: bmi323-imu
    mount_matrix:
      x:
      - 0
      - 1
      - 0
      y:
      - -1
      - 0
      - 0
      z:
      - 0
      - 0
      - 1
options:
  auto_manage: true
target_devices:
- ds5
- keyboard
