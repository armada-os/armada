# Keep the hardware speaker sink as an internal unity-gain transport.
#
# PipeWire Pulse exports only public Audio/Sink nodes, so Steam sees Stereo and
# Virtual Surround Sound while both playback legs can still target this node.

monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "alsa_output.platform-sound.HiFi__Speaker__sink"
      }
    ]
    actions = {
      update-props = {
        media.class = "Audio/Sink/Internal"
        priority.session = 0
        state.restore-props = false
        channelmix.lock-volumes = true
        node.description = "Built-In Audio"
        node.nick = "Built-In Audio"
        device.description = "Built-In Audio"
        media.name = "Built-In Audio"
      }
    }
  }
]
