# AYN Odin 3 virtual 7.1 speaker profile.
#
# Eight application channels are convolved into the two internal speakers.
# The selected base level is -10.60 dB, with the source profile's relative
# front/side/rear/center/LFE balance preserved. A final -1 dBFS sample clamp
# provides an emergency safety ceiling.

context.modules = [
    {
        name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Virtual Surround Sound"
            node.nick = "Virtual Surround Sound"
            device.description = "Virtual Surround Sound"
            media.name = "Virtual Surround Sound"

            filter.graph = {
                nodes = [
                    { type = builtin label = copy name = copyFL }
                    { type = builtin label = copy name = copyFR }
                    { type = builtin label = copy name = copyFC }
                    { type = builtin label = copy name = copyRL }
                    { type = builtin label = copy name = copyRR }
                    { type = builtin label = copy name = copySL }
                    { type = builtin label = copy name = copySR }
                    { type = builtin label = copy name = copyLFE }

                    { type = builtin label = convolver name = convFL_L config = { blocksize = 128 tailsize = 1024 gain = 1.0 resample_quality = 15 filename = "/usr/share/armada/audio/odin3/hrir/vss_speaker.wav" channel = 0 } }
                    { type = builtin label = convolver name = convFL_R config = { blocksize = 128 tailsize = 1024 gain = 1.0 resample_quality = 15 filename = "/usr/share/armada/audio/odin3/hrir/vss_speaker.wav" channel = 1 } }
                    { type = builtin label = convolver name = convSL_L config = { blocksize = 128 tailsize = 1024 gain = 1.0 resample_quality = 15 filename = "/usr/share/armada/audio/odin3/hrir/vss_speaker.wav" channel = 2 } }
                    { type = builtin label = convolver name = convSL_R config = { blocksize = 128 tailsize = 1024 gain = 1.0 resample_quality = 15 filename = "/usr/share/armada/audio/odin3/hrir/vss_speaker.wav" channel = 3 } }
                    { type = builtin label = convolver name = convRL_L config = { blocksize = 128 tailsize = 1024 gain = 1.0 resample_quality = 15 filename = "/usr/share/armada/audio/odin3/hrir/vss_speaker.wav" channel = 4 } }
                    { type = builtin label = convolver name = convRL_R config = { blocksize = 128 tailsize = 1024 gain = 1.0 resample_quality = 15 filename = "/usr/share/armada/audio/odin3/hrir/vss_speaker.wav" channel = 5 } }
                    { type = builtin label = convolver name = convFC_L config = { blocksize = 128 tailsize = 1024 gain = 1.0 resample_quality = 15 filename = "/usr/share/armada/audio/odin3/hrir/vss_speaker.wav" channel = 6 } }
                    { type = builtin label = convolver name = convFR_R config = { blocksize = 128 tailsize = 1024 gain = 1.0 resample_quality = 15 filename = "/usr/share/armada/audio/odin3/hrir/vss_speaker.wav" channel = 7 } }
                    { type = builtin label = convolver name = convFR_L config = { blocksize = 128 tailsize = 1024 gain = 1.0 resample_quality = 15 filename = "/usr/share/armada/audio/odin3/hrir/vss_speaker.wav" channel = 8 } }
                    { type = builtin label = convolver name = convSR_R config = { blocksize = 128 tailsize = 1024 gain = 1.0 resample_quality = 15 filename = "/usr/share/armada/audio/odin3/hrir/vss_speaker.wav" channel = 9 } }
                    { type = builtin label = convolver name = convSR_L config = { blocksize = 128 tailsize = 1024 gain = 1.0 resample_quality = 15 filename = "/usr/share/armada/audio/odin3/hrir/vss_speaker.wav" channel = 10 } }
                    { type = builtin label = convolver name = convRR_R config = { blocksize = 128 tailsize = 1024 gain = 1.0 resample_quality = 15 filename = "/usr/share/armada/audio/odin3/hrir/vss_speaker.wav" channel = 11 } }
                    { type = builtin label = convolver name = convRR_L config = { blocksize = 128 tailsize = 1024 gain = 1.0 resample_quality = 15 filename = "/usr/share/armada/audio/odin3/hrir/vss_speaker.wav" channel = 12 } }
                    { type = builtin label = convolver name = convFC_R config = { blocksize = 128 tailsize = 1024 gain = 1.0 resample_quality = 15 filename = "/usr/share/armada/audio/odin3/hrir/vss_speaker.wav" channel = 13 } }

                    # The profile treats LFE as a centered source.
                    { type = builtin label = convolver name = convLFE_L config = { blocksize = 128 tailsize = 1024 gain = 1.0 resample_quality = 15 filename = "/usr/share/armada/audio/odin3/hrir/vss_speaker.wav" channel = 6 } }
                    { type = builtin label = convolver name = convLFE_R config = { blocksize = 128 tailsize = 1024 gain = 1.0 resample_quality = 15 filename = "/usr/share/armada/audio/odin3/hrir/vss_speaker.wav" channel = 13 } }

                    {
                        type = builtin
                        label = mixer
                        name = mixL
                        control = {
                            "Gain 1" = 0.295248
                            "Gain 2" = 0.265723
                            "Gain 3" = 0.236199
                            "Gain 4" = 0.354298
                            "Gain 5" = 0.295248
                            "Gain 6" = 0.265723
                            "Gain 7" = 0.236199
                            "Gain 8" = 0.295248
                        }
                    }
                    {
                        type = builtin
                        label = mixer
                        name = mixR
                        control = {
                            "Gain 1" = 0.295248
                            "Gain 2" = 0.265723
                            "Gain 3" = 0.236199
                            "Gain 4" = 0.354298
                            "Gain 5" = 0.295248
                            "Gain 6" = 0.265723
                            "Gain 7" = 0.236199
                            "Gain 8" = 0.295248
                        }
                    }

                    { type = builtin label = clamp name = clampL control = { "Min" = -0.8912509381 "Max" = 0.8912509381 } }
                    { type = builtin label = clamp name = clampR control = { "Min" = -0.8912509381 "Max" = 0.8912509381 } }
                ]

                links = [
                    { output = "copyFL:Out" input = "convFL_L:In" }
                    { output = "copyFL:Out" input = "convFL_R:In" }
                    { output = "copySL:Out" input = "convSL_L:In" }
                    { output = "copySL:Out" input = "convSL_R:In" }
                    { output = "copyRL:Out" input = "convRL_L:In" }
                    { output = "copyRL:Out" input = "convRL_R:In" }
                    { output = "copyFC:Out" input = "convFC_L:In" }
                    { output = "copyFC:Out" input = "convFC_R:In" }
                    { output = "copyFR:Out" input = "convFR_L:In" }
                    { output = "copyFR:Out" input = "convFR_R:In" }
                    { output = "copySR:Out" input = "convSR_L:In" }
                    { output = "copySR:Out" input = "convSR_R:In" }
                    { output = "copyRR:Out" input = "convRR_L:In" }
                    { output = "copyRR:Out" input = "convRR_R:In" }
                    { output = "copyLFE:Out" input = "convLFE_L:In" }
                    { output = "copyLFE:Out" input = "convLFE_R:In" }

                    { output = "convFL_L:Out" input = "mixL:In 1" }
                    { output = "convFL_R:Out" input = "mixR:In 1" }
                    { output = "convSL_L:Out" input = "mixL:In 2" }
                    { output = "convSL_R:Out" input = "mixR:In 2" }
                    { output = "convRL_L:Out" input = "mixL:In 3" }
                    { output = "convRL_R:Out" input = "mixR:In 3" }
                    { output = "convFC_L:Out" input = "mixL:In 4" }
                    { output = "convFC_R:Out" input = "mixR:In 4" }
                    { output = "convFR_L:Out" input = "mixL:In 5" }
                    { output = "convFR_R:Out" input = "mixR:In 5" }
                    { output = "convSR_L:Out" input = "mixL:In 6" }
                    { output = "convSR_R:Out" input = "mixR:In 6" }
                    { output = "convRR_L:Out" input = "mixL:In 7" }
                    { output = "convRR_R:Out" input = "mixR:In 7" }
                    { output = "convLFE_L:Out" input = "mixL:In 8" }
                    { output = "convLFE_R:Out" input = "mixR:In 8" }

                    { output = "mixL:Out" input = "clampL:In" }
                    { output = "mixR:Out" input = "clampR:In" }
                ]

                inputs = [
                    "copyFL:In"
                    "copyFR:In"
                    "copyFC:In"
                    "copyLFE:In"
                    "copyRL:In"
                    "copyRR:In"
                    "copySL:In"
                    "copySR:In"
                ]
                outputs = [ "clampL:Out" "clampR:Out" ]
            }

            capture.props = {
                node.name = "Virtual Surround Sound"
                node.description = "Virtual Surround Sound"
                node.nick = "Virtual Surround Sound"
                device.description = "Virtual Surround Sound"
                media.name = "Virtual Surround Sound"
                media.class = Audio/Sink
                node.virtual = true
                priority.session = 2400
                audio.rate = 48000
                audio.channels = 8
                audio.position = [ FL FR FC LFE RL RR SL SR ]
                stream.dont-remix = true
            }

            playback.props = {
                node.name = "effect_output.odin3_dvs"
                media.class = "Stream/Output/Audio/Internal"
                target.object = "alsa_output.platform-sound.HiFi__Speaker__sink"
                node.autoconnect = true
                node.passive = true
                node.dont-fallback = true
                node.linger = true
                node.dont-move = true
                state.restore-props = false
                audio.rate = 48000
                audio.channels = 2
                audio.position = [ FL FR ]
                stream.dont-remix = true
            }
        }
    }
]
