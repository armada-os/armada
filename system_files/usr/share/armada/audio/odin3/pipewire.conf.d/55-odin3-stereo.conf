# AYN Odin 3 two-channel speaker profile.
#
# This graph accepts 7.1 content and performs its own standard stereo downmix.
# Only the resulting left and right signals enter the front-left and
# front-right impulse-response paths. The downmix therefore cannot affect
# Bluetooth, headphone, or other external audio sinks.

context.modules = [
    {
        name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Stereo"
            node.nick = "Stereo"
            device.description = "Stereo"
            media.name = "Stereo"

            filter.graph = {
                nodes = [
                    { type = builtin label = copy name = copyFL }
                    { type = builtin label = copy name = copyFR }
                    { type = builtin label = copy name = copyFC }
                    { type = builtin label = copy name = copyLFE }
                    { type = builtin label = copy name = copyRL }
                    { type = builtin label = copy name = copyRR }
                    { type = builtin label = copy name = copySL }
                    { type = builtin label = copy name = copySR }

                    {
                        type = builtin
                        label = mixer
                        name = downmixL
                        control = {
                            "Gain 1" = 1.0
                            "Gain 2" = 0.707106781
                            "Gain 3" = 0.353553391
                            "Gain 4" = 0.707106781
                            "Gain 5" = 0.707106781
                        }
                    }
                    {
                        type = builtin
                        label = mixer
                        name = downmixR
                        control = {
                            "Gain 1" = 1.0
                            "Gain 2" = 0.707106781
                            "Gain 3" = 0.353553391
                            "Gain 4" = 0.707106781
                            "Gain 5" = 0.707106781
                        }
                    }

                    { type = builtin label = convolver name = convFL_L config = { blocksize = 128 tailsize = 1024 gain = 1.0 resample_quality = 15 filename = "/usr/share/armada/audio/odin3/hrir/vss_speaker.wav" channel = 0 } }
                    { type = builtin label = convolver name = convFL_R config = { blocksize = 128 tailsize = 1024 gain = 1.0 resample_quality = 15 filename = "/usr/share/armada/audio/odin3/hrir/vss_speaker.wav" channel = 1 } }
                    { type = builtin label = convolver name = convFR_L config = { blocksize = 128 tailsize = 1024 gain = 1.0 resample_quality = 15 filename = "/usr/share/armada/audio/odin3/hrir/vss_speaker.wav" channel = 8 } }
                    { type = builtin label = convolver name = convFR_R config = { blocksize = 128 tailsize = 1024 gain = 1.0 resample_quality = 15 filename = "/usr/share/armada/audio/odin3/hrir/vss_speaker.wav" channel = 7 } }

                    {
                        type = builtin
                        label = mixer
                        name = mixL
                        control = {
                            "Gain 1" = 0.295248
                            "Gain 2" = 0.295248
                        }
                    }
                    {
                        type = builtin
                        label = mixer
                        name = mixR
                        control = {
                            "Gain 1" = 0.295248
                            "Gain 2" = 0.295248
                        }
                    }

                    { type = builtin label = clamp name = clampL control = { "Min" = -0.8912509381 "Max" = 0.8912509381 } }
                    { type = builtin label = clamp name = clampR control = { "Min" = -0.8912509381 "Max" = 0.8912509381 } }
                ]

                links = [
                    { output = "copyFL:Out" input = "downmixL:In 1" }
                    { output = "copyFC:Out" input = "downmixL:In 2" }
                    { output = "copyLFE:Out" input = "downmixL:In 3" }
                    { output = "copyRL:Out" input = "downmixL:In 4" }
                    { output = "copySL:Out" input = "downmixL:In 5" }

                    { output = "copyFR:Out" input = "downmixR:In 1" }
                    { output = "copyFC:Out" input = "downmixR:In 2" }
                    { output = "copyLFE:Out" input = "downmixR:In 3" }
                    { output = "copyRR:Out" input = "downmixR:In 4" }
                    { output = "copySR:Out" input = "downmixR:In 5" }

                    { output = "downmixL:Out" input = "convFL_L:In" }
                    { output = "downmixL:Out" input = "convFL_R:In" }
                    { output = "downmixR:Out" input = "convFR_L:In" }
                    { output = "downmixR:Out" input = "convFR_R:In" }

                    { output = "convFL_L:Out" input = "mixL:In 1" }
                    { output = "convFR_L:Out" input = "mixL:In 2" }
                    { output = "convFL_R:Out" input = "mixR:In 1" }
                    { output = "convFR_R:Out" input = "mixR:In 2" }

                    { output = "mixL:Out" input = "clampL:In" }
                    { output = "mixR:Out" input = "clampR:In" }
                ]

                inputs = [
                    "copyFL:In"
                    "copyFR:In"
                    "copyFC:In"
                    "copyLFE:In"
                    "copyRL:In"
                    "copyRR:In"
                    "copySL:In"
                    "copySR:In"
                ]
                outputs = [ "clampL:Out" "clampR:Out" ]
            }

            capture.props = {
                node.name = "Stereo"
                node.description = "Stereo"
                node.nick = "Stereo"
                device.description = "Stereo"
                media.name = "Stereo"
                media.class = Audio/Sink
                node.virtual = true
                priority.session = 2500
                audio.rate = 48000
                audio.channels = 8
                audio.position = [ FL FR FC LFE RL RR SL SR ]
                stream.dont-remix = false
            }

            playback.props = {
                node.name = "effect_output.odin3_stereo"
                media.class = "Stream/Output/Audio/Internal"
                target.object = "alsa_output.platform-sound.HiFi__Speaker__sink"
                node.autoconnect = true
                node.passive = true
                node.dont-fallback = true
                node.linger = true
                node.dont-move = true
                state.restore-props = false
                audio.rate = 48000
                audio.channels = 2
                audio.position = [ FL FR ]
                stream.dont-remix = true
            }
        }
    }
]
