# WirePlumber drop-in for the AYN Odin 3 (SM8750 / WCD939x).
#
# Install to:  /etc/wireplumber/wireplumber.conf.d/51-ayn-odin-3.conf
# (WirePlumber 0.5+; this is SPA-JSON syntax.)
#
# Why this exists:
# The Odin 3 MultiMedia PCM runs on the Qualcomm qdsp6 ADM path with a
# hardware period fixed at 480 frames (10 ms @ 48 kHz) and an 80 ms ring
# buffer. Under sustained load (Proton + FEX emulation) the default headroom
# is too small and the sink produces intermittent crackle. Keeping the sink
# alive also removes the click heard when playback restarts after silence.
#
# Scope: SM8750-AYN card only, so every other device keeps the image defaults.
monitor.alsa.rules = [
  {
    matches = [
      {
        api.alsa.card.name = "SM8750-AYN"
      }
      {
        alsa.card_name = "SM8750-AYN"
      }
    ]
    actions = {
      update-props = {
        api.alsa.headroom = 1024
        session.suspend-timeout-seconds = 0
        node.pause-on-idle = false
      }
    }
  }
]
